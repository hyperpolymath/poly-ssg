# SPDX-License-Identifier: MPL-2.0-or-later
# milk-ssg is the COW engine at satellites/milk-ssg/src/milk-ssg.cow.
# The former Python interpreter (engines/milk-ssg/milk-ssg.py) was retired on
# the owner's ruling of 2026-11-26. This check validates the COW source only.
name: milk-ssg CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No Python in the engine directory
        run: |
          if find engines/milk-ssg -type f -name '*.py' | grep -q .; then
            echo 'Python found in engines/milk-ssg; the engine is COW only' >&2
            exit 1
          fi

      - name: COW engine source is present and holds COW commands
        run: |
          src=satellites/milk-ssg/src/milk-ssg.cow
          test -f "$src"
          count=$(grep -o 'moo\|mOo\|moO\|mOO\|Moo\|MOo\|MoO\|MOO\|OOO\|MMM\|OOM\|oom' "$src" | wc -l)
          echo "COW commands: $count"
          test "$count" -gt 0
