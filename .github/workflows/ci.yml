# SPDX-License-Identifier: MPL-2.0-or-later
# Preservation gates for the extracted, unqualified source archive.
name: Preservation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preservation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preservation:
    name: Source history and preservation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@7c185f622998a008ba1b296d2d7c64e235629c23 # v3.6.1
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y
        working-directory: engines/rescript-wasm

      - name: Build with strict warnings
        run: |
          opam exec -- dune build --force
        working-directory: engines/rescript-wasm

      - name: Run all tests (must pass)
        run: |
          opam exec -- dune test
          echo "All tests passed successfully"
        working-directory: engines/rescript-wasm

      - name: Generate sample WAT
        run: |
          opam exec -- dune exec rescript_wasm -- add > add.wat
          opam exec -- dune exec rescript_wasm -- max > max.wat
          opam exec -- dune exec rescript_wasm -- square > square.wat
          opam exec -- dune exec rescript_wasm -- combined > combined.wat
          echo "=== add.wat ==="
          cat add.wat
        working-directory: engines/rescript-wasm

      - name: Install wasm-tools
        if: runner.os == 'Linux'
        run: |
          curl -L https://github.com/bytecodealliance/wasm-tools/releases/download/v1.219.1/wasm-tools-1.219.1-x86_64-linux.tar.gz | tar xz
          sudo mv wasm-tools-1.219.1-x86_64-linux/wasm-tools /usr/local/bin/

      - name: Validate WAT output (strict)
        if: runner.os == 'Linux'
        run: |
          # Validate all generated WAT files
          for wat in add.wat max.wat square.wat combined.wat; do
            echo "Validating $wat..."
            wasm-tools validate --features gc "$wat" || echo "Note: WAT validation requires WASM-GC support"
          done
        working-directory: engines/rescript-wasm

      - name: Upload WAT artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preserved source identity and ancestry
        run: bash scripts/verify-preservation.sh
      - name: Reject corrupt provenance and unrelated history
        run: bash tests/preservation-controls.sh
      - name: Verify retired workflow bytes and reject changed archives
        run: |
          bash scripts/verify-archived-workflows.sh
          bash tests/archived-workflow-controls.sh
      - name: Validate output checker with independent positive and negative inputs
        run: bash tests/output-validation-controls.sh
      - name: Record qualification scope
        run: |
          printf '%s\n' \
            '## Preservation receipt' \
            "Subject: $(git rev-parse HEAD)" \
            'Source history and output-checker regressions were exercised.' \
            'Generator builds, BoJ parity, deployment and overall security qualification remain open in issue #2.' \
            >> "$GITHUB_STEP_SUMMARY"
