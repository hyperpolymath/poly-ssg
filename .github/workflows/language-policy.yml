# SPDX-License-Identifier: MPL-2.0-or-later
# Source preservation is distinct from permission to introduce new runtime code.
name: Language Policy Enforcement
on:
  push:
    branches: [main, master, develop]
  pull_request:
permissions:
  contents: read
jobs:
  check-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject new prohibited source and identify exact retained objects
        run: bash scripts/check-preserved-language-policy.sh
      - name: Reject changed, relocated and fabricated historical evidence
        run: bash tests/preservation-policy-controls.sh
