# SPDX-License-Identifier: MPL-2.0-or-later
name: Workflow Security Linter
on:
  push:
    paths: ['.github/workflows/**', 'scripts/lint-workflow-contracts.sh', 'tests/workflow-contract-controls.sh']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/lint-workflow-contracts.sh', 'tests/workflow-contract-controls.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse workflow contracts and complete action pins
        run: bash scripts/lint-workflow-contracts.sh
      - name: Reject floating refs without matching comments or script strings
        run: bash tests/workflow-contract-controls.sh
