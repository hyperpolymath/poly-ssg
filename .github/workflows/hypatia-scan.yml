# SPDX-License-Identifier: PMPL-1.0-or-later
name: Hypatia Security Scan
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # The canonical grid reports all evidence and unavailable integrations.
      # No broad path exclusions or caller-local scanner implementation.
      scope-excludes: ''
      report-backs-artifact: ''
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
