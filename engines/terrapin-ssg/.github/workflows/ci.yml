# SPDX-License-Identifier: MPL-2.0-or-later
# terrapin-ssg is the Logo engine at satellites/terrapin-ssg/src/terrapin-ssg.logo.
# The former Python interpreter (engines/terrapin-ssg/terrapin-ssg.py) was
# retired on the owner's ruling of 2026-11-26. This check validates the Logo
# source only.
name: Terrapin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No Python in the engine directory
        run: |
          if find engines/terrapin-ssg -type f -name '*.py' | grep -q .; then
            echo 'Python found in engines/terrapin-ssg; the engine is Logo only' >&2
            exit 1
          fi

      - name: Logo engine source is present and defines procedures
        run: |
          src=satellites/terrapin-ssg/src/terrapin-ssg.logo
          test -f "$src"
          to_count=$(grep -ci '^to ' "$src" || true)
          end_count=$(grep -ci '^end$' "$src" || true)
          echo "TO: $to_count END: $end_count"
          test "$to_count" -gt 0
          test "$to_count" -eq "$end_count"
